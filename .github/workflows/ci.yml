# Continuous integration: configures, builds and runs every test on a clean Ubuntu 24.04.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config \
            libgtk-4-dev libgtksourceview-5-dev libjson-glib-dev libsoup-3.0-dev libsecret-1-dev \
            libvte-2.91-gtk4-dev libgtest-dev librsvg2-bin clang-format

      - name: Show tool versions
        run: |
          cmake --version | head -n 1
          g++ --version | head -n 1
          clang-format --version
          pkg-config --modversion gtk4 gtksourceview-5

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
