<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" role="img" aria-labelledby="t">
  <title id="t">Vermilion Editor</title>
  <g stroke="#1A0A08" stroke-width="3" stroke-linejoin="round" fill="#E34234">
    <!-- mane scallops -->
    <circle cx="51" cy="32" r="11"/>
    <circle cx="45.4" cy="45.4" r="11"/>
    <circle cx="32" cy="51" r="11"/>
    <circle cx="18.6" cy="45.4" r="11"/>
    <circle cx="13" cy="32" r="11"/>
    <circle cx="18.6" cy="18.6" r="11"/>
    <circle cx="32" cy="13" r="11"/>
    <circle cx="45.4" cy="18.6" r="11"/>
  </g>
  <!-- inner disc hides the overlapping outlines -->
  <circle cx="32" cy="32" r="19.5" fill="#E34234"/>
