  <circle cx="37" cy="31" r="2.2" fill="#1A0A08"/>
  <path d="M29 36 H35 L32 39.5 Z" fill="#1A0A08" stroke="#1A0A08" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M32 39.5 V42 M32 42 Q29 45 26 43 M32 42 Q35 45 38 43"
